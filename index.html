<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f8f7ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Tugas Selesai</title>
    <style>
        /* Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f7ff; 
            color: #1e1b4b; 
            display: flex;
            justify-content: center;
            height: 100dvh; 
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Container Utama - Full Screen */
        .app-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px 16px 0 16px; 
        }

        /* Area List Catatan */
        .notes-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px; 
            overflow: hidden; 
        }

        /* Kotak Catatan */
        .note-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(76, 29, 149, 0.05);
            display: flex;
            flex-direction: column;
            flex-grow: 1; 
            overflow: hidden; 
            margin-bottom: 0;
        }

        /* Bagian Atas Catatan */
        .note-header {
            flex-shrink: 0; 
            position: relative;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3e8ff;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-meta {
            font-size: 13px;
            color: #a78bfa; 
            font-weight: 500;
        }

        /* Area Konten */
        .note-content {
            font-size: 16px;
            line-height: 1.6;
            color: #4c1d95;
            white-space: pre-wrap;
            flex-grow: 1; 
            overflow-y: auto; 
            padding-right: 4px;
            -webkit-overflow-scrolling: touch; 
        }
        .note-content::-webkit-scrollbar { width: 4px; }
        .note-content::-webkit-scrollbar-thumb { background: #e9e3ff; border-radius: 4px; }

        .empty-state {
            text-align: center;
            color: #c084fc;
            padding-top: 80px;
            font-size: 18px;
            font-weight: 500;
        }

        /* Tombol Tambah Bulat (FAB) */
        .fab-btn {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom));
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #7c3aed; 
            color: #ffffff;
            font-size: 36px;
            font-weight: 300;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4); 
            display: none; 
            align-items: center;
            justify-content: center;
            z-index: 99;
            transition: transform 0.1s ease;
        }
        .fab-btn:active { transform: scale(0.92); }

        /* iOS Bottom Sheet Form */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 27, 75, 0.4); 
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background-color: #f5f3ff; 
            border-radius: 24px 24px 0 0;
            padding: 20px 16px calc(20px + env(safe-area-inset-bottom)) 16px;
            z-index: 101;
            transition: bottom 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 -5px 25px rgba(76, 29, 149, 0.15);
        }
        .sheet-handle {
            width: 40px;
            height: 5px;
            background-color: #ddd6fe;
            border-radius: 2.5px;
            margin: 0 auto 20px auto;
        }
        .input-group {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .input-group textarea {
            width: 100%;
            border: none;
            padding: 16px 0;
            font-size: 16px; 
            font-family: inherit;
            outline: none;
            color: #1e1b4b;
            background: transparent;
            resize: none; 
            min-height: 180px; 
        }
        .input-group textarea::placeholder { color: #c084fc; }
        .sheet-buttons { display: flex; gap: 12px; }
        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-save { background-color: #7c3aed; color: #ffffff; }
        .btn-cancel { background-color: #ede9fe; color: #7c3aed; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="notesList" class="notes-list">
        </div>
    </div>

    <button class="fab-btn" id="fabBtn" onclick="openSheet()">+</button>

    <div class="modal-overlay" id="modalOverlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div class="input-group">
            <textarea id="noteContent" placeholder="Mulai menulis..."></textarea>
        </div>
        <div class="sheet-buttons">
            <button class="btn btn-cancel" onclick="closeSheet()">Batal</button>
            <button class="btn btn-save" id="saveBtn" onclick="saveNote()">Simpan</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBR-Uio7vtEcktTKF3vt673bO0Yeb8e6W8",
          authDomain: "pesan-cbf23.firebaseapp.com",
          projectId: "pesan-cbf23",
          storageBucket: "pesan-cbf23.firebasestorage.app",
          messagingSenderId: "267628061888",
          appId: "1:267628061888:web:454e04e0663ee3bec07925",
          measurementId: "G-S174QKYL3S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const noteDocRef = doc(db, "Pesan", "IsiPesan");

        const notesList = document.getElementById('notesList');
        const modalOverlay = document.getElementById('modalOverlay');
        const bottomSheet = document.getElementById('bottomSheet');
        const fabBtn = document.getElementById('fabBtn');
        const saveBtn = document.getElementById('saveBtn');

        window.openSheet = openSheet;
        window.closeSheet = closeSheet;
        window.saveNote = saveNote;

        // VERIFIKASI PERANGKAT KE DATABASE
        async function checkDeviceAuthorization() {
            const currentDeviceId = localStorage.getItem('app_device_id');
            
            // Jika browser belum pernah punya ID (artinya belum buka Web Registrasi)
            if (!currentDeviceId) {
                return false;
            }

            try {
                // Cek apakah ID perangkat ini terdaftar di Firestore
                const deviceRef = doc(db, "PerangkatTerdaftar", currentDeviceId);
                const deviceSnap = await getDoc(deviceRef);

                return deviceSnap.exists() && deviceSnap.data().status === "active";
            } catch (error) {
                console.error("Gagal memverifikasi perangkat:", error);
                return false;
            }
        }

        function openSheet() {
            const contentInput = document.getElementById('noteContent');
            contentInput.value = '';

            modalOverlay.style.display = 'block';
            setTimeout(() => {
                modalOverlay.style.opacity = '1';
                bottomSheet.style.bottom = '0';
            }, 10);
            
            setTimeout(() => contentInput.focus(), 300);
        }

        function closeSheet() {
            modalOverlay.style.opacity = '0';
            bottomSheet.style.bottom = '-100%';
            setTimeout(() => {
                modalOverlay.style.display = 'none';
            }, 300);
        }

        // AMBIL DATA CATATAN
        async function displayNotes() {
            notesList.innerHTML = '<div class="empty-state">Memeriksa hak akses perangkat...</div>';
            fabBtn.style.display = 'none';

            // 1. CEK IZIN PERANGKAT TERLEBIH DAHULU
            const isAuthorized = await checkDeviceAuthorization();

            if (!isAuthorized) {
                notesList.innerHTML = `
                    <div class="empty-state" style="color: #ef4444; padding-top: 60px;">
                        🚫 Akses Ditolak
                        <br><br>
                        <span style="font-size: 14px; color: #6b7280; font-weight: normal; line-height: 1.5; display: block; padding: 0 20px;">
                            Perangkat ini belum terverivikasi di sistem.
                        </span>
                    </div>
                `;
                return;
            }

            // 2. JIKA TERDAFTAR, TAMPILKAN CATATAN
            notesList.innerHTML = '<div class="empty-state">Memuat Pesan...</div>';

            try {
                const docSnap = await getDoc(noteDocRef);

                if (!docSnap.exists()) {
                    notesList.innerHTML = '<div class="empty-state">Belum Ada Pesan</div>';
                    fabBtn.style.display = 'flex'; 
                    return;
                }

                const currentNoteData = docSnap.data();
                
                const noteCard = document.createElement('div');
                noteCard.className = 'note-card';
                noteCard.innerHTML = `
                    <div class="note-header">
                        <div class="note-meta">${currentNoteData.date}</div>
                    </div>
                    <div class="note-content">${currentNoteData.content}</div>
                `;
                
                notesList.innerHTML = '';
                notesList.appendChild(noteCard);
                fabBtn.style.display = 'none';
                
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                notesList.innerHTML = '<div class="empty-state">Gagal terhubung ke server</div>';
            }
        }

        async function saveNote() {
            const contentInput = document.getElementById('noteContent');

            if (contentInput.value.trim() === '') {
                closeSheet();
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = "Menyimpan...";

            const now = new Date();
            const dateString = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            
            const newNoteData = {
                content: contentInput.value.trim(),
                date: dateString
            };

            try {
                await setDoc(noteDocRef, newNoteData);
                closeSheet();
                displayNotes(); 
            } catch (error) {
                console.error("Gagal menyimpan:", error);
                alert("Terjadi kesalahan saat menyimpan pesan!");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "Simpan";
            }
        }

        displayNotes();
    </script>
</body>
</html>
